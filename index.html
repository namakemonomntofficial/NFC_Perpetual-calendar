<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wearable Perpetual Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Ubuntu+Condensed&family=Noto+Sans+JP:wght@400;700&family=Saira+Condensed:wght@400;700&family=Saira+Extra+Condensed:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a1a; color: #e0e0e0; font-family: system-ui, sans-serif; font-size: 14px; }
  .page { max-width: 480px; margin: 0 auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 13px; font-weight: 600; color: #555; letter-spacing: .1em;
       text-align: center; padding: 6px 0 8px; border-bottom: 1px solid #2a2a2a; }

  /* ── 設定パネル ── */
  .settings { display: flex; flex-direction: column; gap: 8px;
              background: #202020; border-radius: 10px; padding: 10px; }
  .settings-title { font-size: 11px; color: #555; letter-spacing: .06em; font-weight: 600; margin-bottom: 2px; }
  .ctrl-group { display: flex; flex-direction: column; gap: 3px; }
  .ctrl-label { font-size: 11px; color: #777; font-weight: 500; }
  .hint { font-size: 10px; color: #4a4a4a; margin-top: 1px; }
  select, input[type=date], input[type=number] {
    width: 100%; font-size: 13px; padding: 5px 8px;
    border: 1px solid #383838; border-radius: 6px;
    background: #2a2a2a; color: #e0e0e0;
    -webkit-appearance: none; appearance: none;
  }
  .stepper-row { display: grid; grid-template-columns: 42px minmax(58px, 1fr) 42px auto; align-items: center; gap: 6px; }
  .step-btn {
    width: 42px; height: 36px; border: 1px solid #3d3d3d; border-radius: 7px;
    background: #2d2d2d; color: #e0e0e0; font-size: 18px; font-weight: 700;
    line-height: 1; cursor: pointer; touch-action: manipulation;
  }
  .step-btn:active { background: #3a3a3a; }
  .step-input {
    height: 36px; text-align: center; font-size: 16px; font-weight: 700;
    -moz-appearance: textfield;
  }
  .step-input::-webkit-outer-spin-button,
  .step-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .unit { font-size: 10px; color: #555; }
  .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider-toggle { position: absolute; inset: 0; background: #3a3a3a;
                   border-radius: 20px; cursor: pointer; transition: background .2s; }
  .slider-toggle::before { content: ''; position: absolute; width: 14px; height: 14px;
    left: 3px; top: 3px; background: #888; border-radius: 50%; transition: transform .2s; }
  .toggle input:checked + .slider-toggle { background: #5b9bd5; }
  .toggle input:checked + .slider-toggle::before { transform: translateX(16px); background: #fff; }
  .toggle-row { display: flex; align-items: center; gap: 10px; }
  .toggle-label { font-size: 12px; color: #bbb; }
  .bg-toggle-row { display: flex; align-items: center; gap: 8px; }
  .bg-lbl { font-size: 11px; color: #666; }
  .sep { border: none; border-top: 1px solid #2a2a2a; margin: 2px 0; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ── 上段: カレンダープレビュー + メモ1 ── */
  .top-row { display: flex; gap: 8px; align-items: stretch; }
  .cal-preview-wrap { flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; }
  .canvas-label { font-size: 10px; color: #555; text-align: center; }
  /* 正方形・UI幅の半分 */
  #cvCal {
    display: block;
    width: calc(50vw - 18px);
    max-width: 230px;
    aspect-ratio: 1 / 1;
    image-rendering: pixelated;
    border: 1px solid #333;
  }
  /* メモ1: カレンダープレビューと同じ高さ */
  .memo1-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .memo1-wrap .ctrl-label { font-size: 10px; color: #666; }
  #memoText {
    flex: 1;          /* 親の高さいっぱいに伸びる */
    width: 100%; font-size: 13px; padding: 6px 8px;
    border: 1px solid #333; border-radius: 6px;
    background: #222; color: #e0e0e0;
    resize: none; font-family: inherit; line-height: 1.5;
    min-height: 60px;
  }

  /* ── メモ2 ── */
  .memo2-wrap { display: flex; flex-direction: column; gap: 3px; }
  #memo2Text {
    width: 100%; font-size: 13px; padding: 6px 8px;
    border: 1px solid #333; border-radius: 6px;
    background: #222; color: #e0e0e0;
    resize: vertical; font-family: inherit; line-height: 1.5;
    min-height: 15em;
  }

  /* ── 全体プレビュー ── */
  .full-preview-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .full-preview-label { font-size: 10px; color: #444; }
  #cvFull {
    display: block;
    width: 100%; max-width: 460px;
    aspect-ratio: 176 / 264;
    image-rendering: pixelated;
    border: 1px solid #333;
  }

  /* ── ボタン ── */
  .btn-row { display: flex; gap: 8px; padding-bottom: 20px; }
  .btn { flex: 1; padding: 11px 0; border-radius: 8px; border: none;
         font-size: 13px; font-weight: 600; cursor: pointer;
         transition: opacity .15s; letter-spacing: .04em; }
  .btn:active { opacity: .7; }
  .btn-send { background: #5b9bd5; color: #fff; }
  .btn-dl   { background: #2a2a2a; color: #bbb; border: 1px solid #444; }
  .transfer-status { font-size: 12px; color: #9fc7eb; text-align: center; min-height: 16px; margin-top: -4px; }
  .debug-panel { background: #141414; border: 1px solid #333; border-radius: 8px; padding: 8px; }
  .debug-title { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #777; margin-bottom: 6px; }
  .debug-actions { display: flex; gap: 6px; }
  .debug-clear { border: 1px solid #444; border-radius: 6px; background: #242424; color: #bbb; padding: 4px 8px; font-size: 11px; }
  .debug-log { max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 11px/1.35 monospace; color: #b8d8b8; }
  .hidden   { display: none !important; }
  optgroup { color: #666; }
  option   { color: #e0e0e0; background: #2a2a2a; }
</style>
</head>
<body>
<div class="page">
  <h1>WEARABLE PERPETUAL CALENDAR</h1>

  <!-- ① 設定パネル（最上部） -->
  <div class="settings">
    <div class="settings-title">⚙ 設定</div>

    <div class="ctrl-group">
      <span class="ctrl-label">基準日</span>
      <input type="date" id="baseDate">
    </div>

    <hr class="sep">

    <div class="ctrl-group">
      <span class="ctrl-label">カレンダーフォント</span>
      <select id="fontSel">
        <optgroup label="Webフォント">
          <option value="'BIZ UDGothic', sans-serif">BIZ UDGothic</option>
          <option value="'Ubuntu Condensed', sans-serif">Ubuntu Condensed</option>
          <option value="'Saira Condensed', sans-serif">Saira Condensed</option>
          <option value="'Saira Extra Condensed', sans-serif">Saira Extra Condensed</option>
        </optgroup>
        <optgroup label="システムフォント（端末依存）">
          <option value="'DIN Condensed', 'Saira Condensed', sans-serif">DIN Condensed Bold ※</option>
          <option value="'Bahnschrift Condensed', 'Bahnschrift SemiCondensed', 'Saira Extra Condensed', sans-serif">Bahnschrift Condensed ※</option>
          <option value="'DIN 1451 Engschrift', 'DIN Condensed', 'Saira Extra Condensed', sans-serif">DIN 1451 Engschrift ※</option>
        </optgroup>
      </select>
      <span class="hint">※ = システムフォント（macOS/iOS/Windows端末のみ表示）/ 未所持の場合は代替Webフォントを使用</span>
    </div>

    <div class="two-col">
      <div class="ctrl-group">
        <span class="ctrl-label">文字サイズ</span>
        <div class="stepper-row">
          <button type="button" class="step-btn" data-step-target="fontSize" data-step="-1" aria-label="文字サイズを小さく">‹</button>
          <input class="step-input" type="number" id="fontSize" min="8" max="36" value="18" step="1" inputmode="numeric">
          <button type="button" class="step-btn" data-step-target="fontSize" data-step="1" aria-label="文字サイズを大きく">›</button>
          <span class="unit">px</span>
        </div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">余白</span>
        <div class="stepper-row">
          <button type="button" class="step-btn" data-step-target="padding" data-step="-1" aria-label="余白を小さく">‹</button>
          <input class="step-input" type="number" id="padding" min="2" max="12" value="2" step="1" inputmode="numeric">
          <button type="button" class="step-btn" data-step-target="padding" data-step="1" aria-label="余白を大きく">›</button>
          <span class="unit">px</span>
        </div>
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">太さ</span>
      <select id="fontWeight">
        <option value="400">Regular</option>
        <option value="700" selected>Bold</option>
      </select>
    </div>

    <hr class="sep">

    <div class="ctrl-group">
      <span class="ctrl-label">メモフォント（メモ1・2 共通）</span>
      <select id="memoFont">
        <option value="'M PLUS 1p', sans-serif">M PLUS 1p（日本語）</option>
        <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
        <option value="'BIZ UDGothic', sans-serif">BIZ UDGothic</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">メモ文字サイズ</span>
      <div class="stepper-row">
        <button type="button" class="step-btn" data-step-target="memoFontSize" data-step="-1" aria-label="メモ文字サイズを小さく">‹</button>
        <input class="step-input" type="number" id="memoFontSize" min="6" max="30" value="14" step="1" inputmode="numeric">
        <button type="button" class="step-btn" data-step-target="memoFontSize" data-step="1" aria-label="メモ文字サイズを大きく">›</button>
        <span class="unit">px</span>
      </div>
    </div>

    <hr class="sep">

    <div class="two-col">
      <div class="ctrl-group">
        <span class="ctrl-label">背景 ／ 文字色</span>
        <div class="bg-toggle-row">
          <span class="bg-lbl">白</span>
          <label class="toggle">
            <input type="checkbox" id="darkMode">
            <span class="slider-toggle"></span>
          </label>
          <span class="bg-lbl">黒</span>
        </div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">1bitシャープ化</span>
        <div class="toggle-row">
          <label class="toggle">
            <input type="checkbox" id="antiAlias" checked>
            <span class="slider-toggle"></span>
          </label>
          <span class="toggle-label">ON</span>
        </div>
      </div>
    </div>
  </div><!-- /settings -->

  <!-- ② カレンダープレビュー + メモ1 横並び -->
  <div class="top-row">
    <div class="cal-preview-wrap">
      <span class="canvas-label">カレンダープレビュー</span>
      <canvas id="cvCal" width="176" height="176"></canvas>
    </div>
    <div class="memo1-wrap">
      <span class="ctrl-label">メモ1（右列・5行）</span>
      <textarea id="memoText" rows="5" placeholder="1行目&#10;2行目&#10;3行目&#10;4行目&#10;5行目"></textarea>
    </div>
  </div>

  <!-- ③ メモ2（全幅） -->
  <div class="memo2-wrap">
    <span class="ctrl-label">メモ2（横線の下・自由記述）</span>
    <textarea id="memo2Text" rows="10" placeholder="メモを入力..."></textarea>
  </div>

  <!-- ④ 全体プレビュー（幅フル） -->
  <div class="full-preview-wrap">
    <span class="full-preview-label">全体プレビュー（176 × 264 px）</span>
    <canvas id="cvFull" width="176" height="264"></canvas>
  </div>

  <!-- ⑤ ボタン -->
  <div class="btn-row">
    <button class="btn btn-send hidden" id="btnSend">📡 e-Paperに転送</button>
    <button class="btn btn-dl" id="btnDl">↓ PNG 保存</button>
  </div>
  <div class="transfer-status hidden" id="transferStatus"></div>
  <div class="debug-panel">
    <div class="debug-title">
      <span>DEBUG</span>
      <div class="debug-actions">
        <button type="button" class="debug-clear" id="btnCopyDebug">copy</button>
        <button type="button" class="debug-clear" id="btnClearDebug">clear</button>
      </div>
    </div>
    <pre class="debug-log" id="debugLog"></pre>
  </div>

</div><!-- /page -->
<script>
'use strict';
const cvCal  = document.getElementById('cvCal');
const cvFull = document.getElementById('cvFull');
const ctxCal  = cvCal.getContext('2d');
const ctxFull = cvFull.getContext('2d');
const get = id => document.getElementById(id);

const COLS = 7, ROWS = 5;
const MONTH_ALPHA    = ['J','F','M','A','M','J','J','A','S','O','N','D'];
const CAL_OFFSET_X   = -3;
const COL_SQUEEZE    = 2;
const MONTH_OFFSET_X = -2;
const NUMBER_OFFSET_Y = 1;
const SELECTED_INSET  = 2;
let calHitCells = [];
let dateFrameOverrides = {};

const today = new Date();
const p2 = n => String(n).padStart(2,'0');
get('baseDate').value =
  `${today.getFullYear()}-${p2(today.getMonth()+1)}-${p2(today.getDate())}`;

// ── ユーティリティ ──────────────────────────────────────────────

function getTwoDigitMaxW(c, weight, size, font) {
  c.font = `${weight} ${size}px ${font}`;
  let max = 0;
  for (let i = 10; i <= 31; i++) {
    const w = c.measureText(String(i)).width;
    if (w > max) max = w;
  }
  return max;
}
function getSundayOfWeek(date) {
  const d = new Date(date); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay()); return d;
}
function getNewMonthInWeek(weekSunDate) {
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekSunDate); d.setDate(d.getDate() + i);
    if (d.getDate() === 1) return d.getMonth();
  }
  return null;
}
function colX(calX, col, cW) {
  return calX + col * cW - col * COL_SQUEEZE;
}

function nthWeekdayOfMonth(year, monthIndex, weekday, nth) {
  const date = new Date(year, monthIndex, 1);
  const offset = (weekday - date.getDay() + 7) % 7;
  date.setDate(1 + offset + (nth - 1) * 7);
  return date.getDate();
}

function springEquinoxDay(year) {
  if (year <= 1979) return Math.floor(20.8357 + 0.242194 * (year - 1980) - Math.floor((year - 1983) / 4));
  if (year <= 2099) return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  return 20;
}

function autumnEquinoxDay(year) {
  if (year <= 1979) return Math.floor(23.2588 + 0.242194 * (year - 1980) - Math.floor((year - 1983) / 4));
  if (year <= 2099) return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  return 23;
}

function addHoliday(set, year, monthIndex, day) {
  set.add(`${year}-${p2(monthIndex + 1)}-${p2(day)}`);
}

function baseJapaneseHolidays(year) {
  const set = new Set();
  addHoliday(set, year, 0, 1);
  addHoliday(set, year, 1, 11);
  if (year >= 2020) addHoliday(set, year, 1, 23);
  addHoliday(set, year, 2, springEquinoxDay(year));
  addHoliday(set, year, 3, 29);
  addHoliday(set, year, 4, 3);
  addHoliday(set, year, 4, 4);
  addHoliday(set, year, 4, 5);
  addHoliday(set, year, 10, 3);
  addHoliday(set, year, 10, 23);
  if (year >= 2000) addHoliday(set, year, 0, nthWeekdayOfMonth(year, 0, 1, 2));
  else addHoliday(set, year, 0, 15);
  if (year === 2020) addHoliday(set, year, 6, 23);
  else if (year === 2021) addHoliday(set, year, 6, 22);
  else if (year >= 2003) addHoliday(set, year, 6, nthWeekdayOfMonth(year, 6, 1, 3));
  else if (year >= 1996) addHoliday(set, year, 6, 20);
  if (year === 2020) addHoliday(set, year, 7, 10);
  else if (year === 2021) addHoliday(set, year, 7, 8);
  else if (year >= 2016) addHoliday(set, year, 7, 11);
  if (year >= 2003) addHoliday(set, year, 8, nthWeekdayOfMonth(year, 8, 1, 3));
  else addHoliday(set, year, 8, 15);
  addHoliday(set, year, 8, autumnEquinoxDay(year));
  if (year === 2020) addHoliday(set, year, 6, 24);
  else if (year === 2021) addHoliday(set, year, 6, 23);
  else if (year >= 2000) addHoliday(set, year, 9, nthWeekdayOfMonth(year, 9, 1, 2));
  else addHoliday(set, year, 9, 10);
  if (year === 2019) {
    addHoliday(set, year, 4, 1);
    addHoliday(set, year, 9, 22);
  }
  return set;
}

const holidayCache = {};
function japaneseHolidays(year) {
  if (holidayCache[year]) return holidayCache[year];
  const set = baseJapaneseHolidays(year);
  for (const key of [...set].sort()) {
    const date = dateFromKey(key);
    if (date.getDay() !== 0) continue;
    const sub = new Date(date);
    do {
      sub.setDate(sub.getDate() + 1);
    } while (set.has(dateKey(sub)));
    if (sub.getFullYear() === year) set.add(dateKey(sub));
  }
  for (let month = 0; month < 12; month++) {
    for (let day = 2; day <= 30; day++) {
      const date = new Date(year, month, day);
      if (date.getMonth() !== month) continue;
      const key = dateKey(date);
      if (set.has(key)) continue;
      const prev = new Date(date); prev.setDate(date.getDate() - 1);
      const next = new Date(date); next.setDate(date.getDate() + 1);
      if (set.has(dateKey(prev)) && set.has(dateKey(next))) set.add(key);
    }
  }
  holidayCache[year] = set;
  return set;
}

function dateFromKey(key) {
  const [year, month, day] = key.split('-').map(Number);
  const date = new Date(year, month - 1, day);
  date.setHours(0, 0, 0, 0);
  return date;
}

function isJapaneseHoliday(date) {
  return japaneseHolidays(date.getFullYear()).has(dateKey(date));
}

function isDefaultFramedDate(date) {
  const day = date.getDay();
  return day === 0 || day === 6 || isJapaneseHoliday(date);
}

function isDateFramed(date) {
  const key = dateKey(date);
  if (Object.prototype.hasOwnProperty.call(dateFrameOverrides, key)) {
    return !!dateFrameOverrides[key];
  }
  return isDefaultFramedDate(date);
}

function getBaseDate() {
  const value = get('baseDate').value;
  if (!value) return null;
  const [y, m, d] = value.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setHours(0, 0, 0, 0);
  return date;
}

function dateKey(date) {
  return `${date.getFullYear()}-${p2(date.getMonth() + 1)}-${p2(date.getDate())}`;
}

function getDisplayedWeekKeys() {
  const baseDate = getBaseDate();
  if (!baseDate) return [];
  const startDate = getSundayOfWeek(baseDate);
  startDate.setDate(startDate.getDate() - 14);
  return Array.from({ length: ROWS }, (_, row) => {
    const date = new Date(startDate);
    date.setDate(startDate.getDate() + row * 7);
    return dateKey(date);
  });
}

function applyOneBitSharpen(canvas, context) {
  if (!get('antiAlias').checked) return;
  const image = context.getImageData(0, 0, canvas.width, canvas.height);
  const pixels = image.data;
  for (let i = 0; i < pixels.length; i += 4) {
    const luminance = pixels[i] * 0.299 + pixels[i + 1] * 0.587 + pixels[i + 2] * 0.114;
    const value = luminance < 160 ? 0 : 255;
    pixels[i] = value;
    pixels[i + 1] = value;
    pixels[i + 2] = value;
    pixels[i + 3] = 255;
  }
  context.putImageData(image, 0, 0);
}

// ── カレンダー描画コア ──
// showMemos=true → 縦線・横線・メモ1・メモ2を描画（全体プレビュー）
// showMemos=false → 縦線のみ描画、メモ1も描画（カレンダープレビュー）
// ※縦線はどちらも常に描画

function drawCalendar(c, canvasH, showMemos) {
  const dark      = get('darkMode').checked;
  const color     = dark ? '#ffffff' : '#000000';
  const bg        = dark ? '#000000' : '#ffffff';
  const size      = getNumberValue('fontSize', 18);
  const pad       = Math.max(2, getNumberValue('padding', 2));
  const font      = get('fontSel').value;
  const weight    = get('fontWeight').value;
  const extra     = pad - 2;

  const baseDateStr = get('baseDate').value;
  if (!baseDateStr) return null;
  const [y, m, d] = baseDateStr.split('-').map(Number);
  const baseDate = new Date(y, m-1, d); baseDate.setHours(0,0,0,0);
  const weekSun   = getSundayOfWeek(baseDate);
  const startDate = new Date(weekSun);
  startDate.setDate(startDate.getDate() - 14);

  c.save();
  c.imageSmoothingEnabled = false;
  c.font = `${weight} ${size}px ${font}`;
  c.textBaseline = 'top';

  const twoDigitW = Math.ceil(getTwoDigitMaxW(c, weight, size, font));
  const boxW  = twoDigitW + 2;
  const boxH  = size + 2;
  const cW    = boxW + extra * 2;
  const cH    = boxH + extra * 2;

  const mColW = twoDigitW - 1;
  const mColX = MONTH_OFFSET_X;
  const calX  = mColX + mColW + 1 + CAL_OFFSET_X;
  const startY = 0; // 全体を上端に詰める

  const lastColX = colX(calX, COLS - 1, cW);
  const divX     = lastColX + cW;
  const memoX    = divX + 2; // カレンダーとの余白は2pxのみ
  const memoW    = 176 - memoX;

  // 背景
  c.fillStyle = bg;
  c.fillRect(0, 0, 176, canvasH);

  // 横線（全体プレビューのみ）
  if (showMemos) {
    const hLineY = startY + ROWS * cH + 1;
    c.fillStyle = color;
    c.fillRect(2, hLineY, 172, 1);
  }

  // ── カレンダー数字・枠・反転 ──
  const cells = [];
  for (let i = 0; i < COLS * ROWS; i++) {
    const col = i % COLS;
    const row = Math.floor(i / COLS);
    const cx  = colX(calX, col, cW);
    const cy  = startY + row * cH;
    if (cy + cH > canvasH) continue;

    const cellDate = new Date(startDate);
    cellDate.setDate(startDate.getDate() + i);
    cellDate.setHours(0,0,0,0);

    const dayNum = cellDate.getDate();
    const txt    = String(dayNum);
    const tw     = c.measureText(txt).width;
    const bx = cx + extra;
    const by = cy + extra;
    const tx = bx + 1 + (twoDigitW - tw);
    const ty = by + 1 + NUMBER_OFFSET_Y;

    const isSelected = cellDate.getTime() === baseDate.getTime();
    const isFramed = isDateFramed(cellDate);
    cells.push({ key: dateKey(cellDate), x: cx, y: cy, w: cW, h: cH });

    if (isSelected) {
      c.fillStyle = color;
      c.fillRect(
        bx + SELECTED_INSET,
        by + SELECTED_INSET,
        boxW - SELECTED_INSET * 2,
        boxH - SELECTED_INSET * 2
      );
      c.fillStyle = bg;    c.fillText(txt, tx, ty);
    } else {
      c.fillStyle = color; c.fillText(txt, tx, ty);
    }
    if (isFramed) {
      c.strokeStyle = color; c.lineWidth = 1;
      c.strokeRect(bx + 0.5, by + 0.5, boxW - 1, boxH - 1);
    }
  }

  // ── 月列（数字固定） ──
  for (let row = 0; row < ROWS; row++) {
    const cy = startY + row * cH;
    if (cy + cH > canvasH) continue;
    const rowSun = new Date(startDate);
    rowSun.setDate(startDate.getDate() + row * COLS); rowSun.setHours(0,0,0,0);
    const newMonth    = getNewMonthInWeek(rowSun);
    const monthToShow = (newMonth !== null) ? newMonth : rowSun.getMonth();
    let show = true;
    if (row > 0) {
      const prevSun = new Date(startDate);
      prevSun.setDate(startDate.getDate() + (row-1) * COLS); prevSun.setHours(0,0,0,0);
      const prevNew   = getNewMonthInWeek(prevSun);
      const prevShown = (prevNew !== null) ? prevNew : prevSun.getMonth();
      show = monthToShow !== prevShown;
    }
    if (show) {
      const label = String(monthToShow + 1);
      c.font = `${weight} ${size}px ${font}`;
      c.textBaseline = 'top';
      const lw = c.measureText(label).width;
      c.fillStyle = color;
      c.fillText(label, mColX + Math.round((mColW - lw) / 2), cy + extra + 1 + NUMBER_OFFSET_Y);
    }
  }

  // ── メモ1（カレンダープレビューでも描画） ──
  const memoLines = get('memoText').value.split('\n').slice(0, ROWS);
  const memoFont  = get('memoFont').value;
  const memoSize  = getNumberValue('memoFontSize', 14);
  c.textBaseline = 'top';
  for (let row = 0; row < ROWS; row++) {
    const line = memoLines[row] || ''; if (!line) continue;
    const cy = startY + row * cH;
    if (cy + cH > canvasH) continue;
    c.font = `${weight} ${memoSize}px ${memoFont}`;
    c.fillStyle = color;
    c.save();
    c.beginPath(); c.rect(memoX, cy, memoW, cH); c.clip();
    c.fillText(line, memoX, cy + extra + 1);
    c.restore();
  }

  c.restore();
  return { twoDigitW, boxW, boxH, cW, cH, calX, startY, mColW, mColX, extra, divX, memoX, memoW, cells };
}

// ── メモ2描画（全体プレビューのみ）──

function drawMemos(c, layout) {
  const dark     = get('darkMode').checked;
  const color    = dark ? '#ffffff' : '#000000';
  const weight   = get('fontWeight').value;
  const memoFont = get('memoFont').value;
  const memoSize = getNumberValue('memoFontSize', 14);
  const memo2Text = get('memo2Text').value;

  const { cH, startY, memoX } = layout;
  const calBottomY = startY + ROWS * cH;
  const memo2Y     = calBottomY + 3;

  if (memo2Text) {
    c.font = `${weight} ${memoSize}px ${memoFont}`;
    c.textBaseline = 'top'; c.fillStyle = color;
    const lineH = memoSize + 2;
    let curY = memo2Y;
    for (const rawLine of memo2Text.split('\n')) {
      if (curY + memoSize > 264) break;
      let line = rawLine;
      while (line.length > 0) {
        let end = line.length;
        while (end > 0 && c.measureText(line.slice(0, end)).width > 176) end--;
        if (end === 0) end = 1;
        c.fillText(line.slice(0, end), 0, curY);
        line = line.slice(end); curY += lineH;
        if (curY + memoSize > 264) break;
      }
    }
  }
}

// ── メイン描画 ──

function draw() {
  // カレンダープレビュー（176×176・線なし・メモなし）
  const calLayout = drawCalendar(ctxCal, 176, false);
  calHitCells = calLayout ? calLayout.cells : [];

  // 全体プレビュー（176×264・線あり・メモあり）
  const layout = drawCalendar(ctxFull, 264, true);
  if (layout) drawMemos(ctxFull, layout);

  applyOneBitSharpen(cvCal, ctxCal);
  applyOneBitSharpen(cvFull, ctxFull);
}

// ── イベント ──

const STORAGE_KEY = 'wearable-calendar-v2';
const MEMO1_WEEKS_KEY = 'wearable-calendar-memo1-weeks-v1';
const FRAME_OVERRIDES_KEY = 'wearable-calendar-frame-overrides-v1';
const FIELD_IDS = [
  'fontSel', 'fontSize', 'padding', 'fontWeight',
  'memoFont', 'memoFontSize', 'darkMode', 'antiAlias', 'memoText', 'memo2Text'
];

function getNumberValue(id, fallback) {
  const value = parseInt(get(id).value, 10);
  return Number.isFinite(value) ? value : fallback;
}

function clampNumberInput(el) {
  const min = parseInt(el.min, 10);
  const max = parseInt(el.max, 10);
  const fallback = parseInt(el.defaultValue || el.value || el.min || '0', 10);
  let value = parseInt(el.value, 10);
  if (!Number.isFinite(value)) value = fallback;
  if (Number.isFinite(min)) value = Math.max(min, value);
  if (Number.isFinite(max)) value = Math.min(max, value);
  el.value = String(value);
}

function saveSettings() {
  const data = {};
  for (const id of FIELD_IDS) {
    const el = get(id);
    data[id] = el.type === 'checkbox' ? el.checked : el.value;
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadFrameOverrides() {
  try {
    dateFrameOverrides = JSON.parse(localStorage.getItem(FRAME_OVERRIDES_KEY) || '{}');
  } catch (e) {
    dateFrameOverrides = {};
  }
}

function saveFrameOverrides() {
  localStorage.setItem(FRAME_OVERRIDES_KEY, JSON.stringify(dateFrameOverrides));
}

function toggleDateFrame(key) {
  const date = dateFromKey(key);
  const current = isDateFramed(date);
  const next = !current;
  if (next === isDefaultFramedDate(date)) {
    delete dateFrameOverrides[key];
  } else {
    dateFrameOverrides[key] = next;
  }
  saveFrameOverrides();
}

function loadMemo1Weeks() {
  try {
    return JSON.parse(localStorage.getItem(MEMO1_WEEKS_KEY) || '{}');
  } catch (e) {
    return {};
  }
}

function saveMemo1ForDisplayedWeeks() {
  const weeks = loadMemo1Weeks();
  const keys = getDisplayedWeekKeys();
  const lines = get('memoText').value.split('\n').slice(0, ROWS);
  keys.forEach((key, index) => {
    const line = lines[index] || '';
    if (line) weeks[key] = line;
    else delete weeks[key];
  });
  localStorage.setItem(MEMO1_WEEKS_KEY, JSON.stringify(weeks));
}

function restoreMemo1ForDisplayedWeeks() {
  const keys = getDisplayedWeekKeys();
  const weeks = loadMemo1Weeks();
  get('memoText').value = keys.map(key => weeks[key] || '').join('\n').replace(/\n+$/, '');
}

function migrateLegacyMemo1() {
  if (localStorage.getItem(MEMO1_WEEKS_KEY)) return;
  saveMemo1ForDisplayedWeeks();
}

function restoreSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    for (const id of FIELD_IDS) {
      const el = get(id);
      if (!(id in data)) continue;
      if (el.type === 'checkbox') el.checked = !!data[id];
      else el.value = data[id];
    }
    ['fontSize', 'padding', 'memoFontSize'].forEach(id => clampNumberInput(get(id)));
  } catch (e) {
    console.warn('設定の復元に失敗しました', e);
  }
}

function drawAndSave() {
  draw();
  saveSettings();
}

document.querySelectorAll('.step-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const id = btn.dataset.stepTarget;
    const delta = parseInt(btn.dataset.step, 10);
    const el = get(id);
    const step = parseInt(el.step || '1', 10) || 1;
    el.value = String(getNumberValue(id, parseInt(el.defaultValue || el.min || '0', 10)) + delta * step);
    clampNumberInput(el);
    drawAndSave();
  });
});

cvCal.addEventListener('pointerdown', event => {
  const rect = cvCal.getBoundingClientRect();
  const x = (event.clientX - rect.left) * cvCal.width / rect.width;
  const y = (event.clientY - rect.top) * cvCal.height / rect.height;
  const hit = calHitCells.find(cell =>
    x >= cell.x && x <= cell.x + cell.w &&
    y >= cell.y && y <= cell.y + cell.h
  );
  if (!hit) return;
  toggleDateFrame(hit.key);
  drawAndSave();
});

['fontSize', 'padding', 'memoFontSize'].forEach(id => {
  const el = get(id);
  el.addEventListener('input', () => {
    draw();
    if (el.value !== '') saveSettings();
  });
  el.addEventListener('change', () => {
    clampNumberInput(el);
    drawAndSave();
  });
});

['fontSel','fontWeight','memoFont'].forEach(id =>
  get(id).addEventListener('change', drawAndSave));
get('baseDate').addEventListener('change', () => {
  restoreMemo1ForDisplayedWeeks();
  drawAndSave();
});
['antiAlias','darkMode'].forEach(id =>
  get(id).addEventListener('change', drawAndSave));
get('memoText').addEventListener('input', () => {
  saveMemo1ForDisplayedWeeks();
  drawAndSave();
});
get('memo2Text').addEventListener('input', drawAndSave);

loadFrameOverrides();
restoreSettings();
migrateLegacyMemo1();
restoreMemo1ForDisplayedWeeks();
draw();

function currentImageDataUrl() {
  const transferCanvas = document.createElement('canvas');
  transferCanvas.width = 264;
  transferCanvas.height = 176;
  const transferContext = transferCanvas.getContext('2d');
  transferContext.fillStyle = get('darkMode').checked ? '#000000' : '#ffffff';
  transferContext.fillRect(0, 0, transferCanvas.width, transferCanvas.height);
  transferContext.translate(264, 0);
  transferContext.rotate(Math.PI / 2);
  transferContext.drawImage(cvFull, 0, 0);
  return transferCanvas.toDataURL('image/png');
}

get('btnDl').addEventListener('click', () => {
  const dataUrl = currentImageDataUrl();
  if (window.AndroidInterface?.onSavePngRequested) {
    window.AndroidInterface.onSavePngRequested(dataUrl);
    return;
  }
  const a = document.createElement('a');
  a.download = 'epaper_calendar_176x264.png';
  a.href = dataUrl;
  a.click();
});

window.getImageDataUrl = currentImageDataUrl;
window.showSendButton  = () => get('btnSend').classList.remove('hidden');
window.setTransferStatus = message => {
  const el = get('transferStatus');
  el.textContent = message || '';
  el.classList.toggle('hidden', !message);
};
window.clearDebugLog = () => {
  get('debugLog').textContent = '';
};
window.appendDebugLog = message => {
  const el = get('debugLog');
  const line = `[${new Date().toLocaleTimeString()}] ${message}`;
  el.textContent += (el.textContent ? '\n' : '') + line;
  el.scrollTop = el.scrollHeight;
};
window.copyDebugLog = async () => {
  const text = get('debugLog').textContent || '';
  if (window.AndroidInterface?.copyDebugLog) {
    window.AndroidInterface.copyDebugLog(text);
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
};
get('btnCopyDebug').addEventListener('click', window.copyDebugLog);
get('btnClearDebug').addEventListener('click', window.clearDebugLog);
get('btnSend').addEventListener('click', () => {
  const dataUrl = currentImageDataUrl();
  if (window.AndroidInterface?.onSendRequested)
    window.AndroidInterface.onSendRequested(dataUrl);
});

setTimeout(draw, 500);
</script>
