<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NFCカレンダー 1.54</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=M+PLUS+1p:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Ubuntu+Condensed&family=Saira+Condensed:wght@400;700&family=Saira+Extra+Condensed:wght@400;700&display=swap');
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #eee; }
  main { width: min(100%, 520px); margin: 0 auto; padding: 12px; }
  h1 { margin: 0 0 10px; font-size: 18px; }
  .preview-shell { position: relative; display: grid; place-items: center; padding: 12px; background: #252525; border-radius: 12px; }
  #calendar { width: min(86vw, 360px); height: min(86vw, 360px); background: #fff; image-rendering: pixelated; touch-action: none; }
  .loupe { position: absolute; width: 112px; height: 112px; padding: 2px; background: #fff; border: 2px solid #777; pointer-events: none; z-index: 3; }
  .loupe.hidden { display: none; }
  #loupeCanvas { width: 104px; height: 104px; image-rendering: pixelated; }
  section { margin-top: 10px; padding: 10px; background: #202020; border-radius: 10px; }
  .row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .row > label { min-width: 76px; }
  button, input, select { min-height: 40px; border: 1px solid #777; border-radius: 8px; background: #333; color: #fff; font-size: 15px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.primary { background: #145da0; border-color: #2c8ee8; }
  button.danger { background: #7b2020; }
  .mode { flex: 1 1 90px; }
  .mode.active { outline: 3px solid #f1c40f; background: #555; }
  .mode.holiday.active { outline-color: #ff5555; }
  .status { margin: 4px 0; color: #bbb; font-size: 13px; line-height: 1.4; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper input { width: 70px; text-align: center; }
  pre { margin: 6px 0 0; max-height: 180px; overflow: auto; padding: 8px; background: #080808; color: #9fef9f; font-size: 11px; white-space: pre-wrap; }
  .grow { flex: 1; }
</style>
</head>
<body>
<main>
  <h1>NFCカレンダー 1.54</h1>
  <div class="preview-shell" id="previewShell">
    <canvas id="calendar" width="200" height="200" aria-label="200×200 カレンダープレビュー"></canvas>
    <div class="loupe hidden" id="loupe"><canvas id="loupeCanvas" width="104" height="104"></canvas></div>
  </div>

  <section>
    <div class="row">
      <button class="mode active" data-mode="event">予定モード</button>
      <button class="mode holiday" data-mode="holiday">休日モード</button>
    </div>
    <div class="status" id="modeHelp">日付を選ぶたびに、予定枠の有無を切り替えます。</div>
  </section>

  <section>
    <div class="row">
      <label for="baseDate">基準日</label>
      <input id="baseDate" type="date">
    </div>
    <div class="row">
      <button id="prevWeek">← 前週</button>
      <button id="today">今日</button>
      <button id="nextWeek">次週 →</button>
    </div>
    <div class="status" id="calendarState">カレンダーを確認しています</div>
    <div class="status" id="tasksState">Googleタスクは未連携です</div>
    <div class="row">
      <button class="primary" id="connectTasks">Googleタスクを連携・更新</button>
    </div>
  </section>

  <section>
    <div class="row">
      <label for="fontFamily">フォント</label>
      <select id="fontFamily">
        <option value="'BIZ UDGothic', sans-serif">BIZ UDGothic（旧アプリ標準）</option>
        <option value="'Ubuntu Condensed', sans-serif">Ubuntu Condensed</option>
        <option value="'Saira Condensed', sans-serif">Saira Condensed</option>
        <option value="'Saira Extra Condensed', sans-serif">Saira Extra Condensed</option>
        <option value="'DIN Condensed', 'Saira Condensed', sans-serif">DIN Condensed</option>
        <option value="'Bahnschrift Condensed', 'Bahnschrift SemiCondensed', 'Saira Extra Condensed', sans-serif">Bahnschrift Condensed</option>
        <option value="'DIN 1451 Engschrift', 'DIN Condensed', 'Saira Extra Condensed', sans-serif">DIN 1451 Engschrift</option>
      </select>
    </div>
    <div class="row">
      <label for="fontSize">日付サイズ</label>
      <span class="stepper">
        <button data-target="fontSize" data-step="-1">−</button>
        <input id="fontSize" type="number" min="13" max="20" value="17">
        <button data-target="fontSize" data-step="1">＋</button>
      </span>
    </div>
    <div class="row">
      <label for="monthFontSize">月表示サイズ</label>
      <span class="stepper">
        <button data-target="monthFontSize" data-step="-1">−</button>
        <input id="monthFontSize" type="number" min="10" max="20" value="15">
        <button data-target="monthFontSize" data-step="1">＋</button>
      </span>
    </div>
    <div class="row">
      <label><input id="bold" type="checkbox" checked> 太字</label>
      <label><input id="quantize" type="checkbox" checked> 白・黒・赤へ量子化</label>
    </div>
    <div class="row">
      <label for="detailFontFamily">予定詳細フォント</label>
      <select id="detailFontFamily">
        <option value="'M PLUS 1p', sans-serif">M PLUS 1p（旧アプリ標準）</option>
        <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
        <option value="'BIZ UDGothic', sans-serif">BIZ UDGothic</option>
      </select>
    </div>
    <div class="row">
      <label for="detailFontSize">予定詳細サイズ</label>
      <span class="stepper">
        <button data-target="detailFontSize" data-step="-1">−</button>
        <input id="detailFontSize" type="number" min="7" max="14" value="9">
        <button data-target="detailFontSize" data-step="1">＋</button>
      </span>
      <label><input id="detailBold" type="checkbox" checked> 予定詳細を太字</label>
    </div>
  </section>

  <section>
    <div class="row">
      <button class="primary" id="send">NFCで転送</button>
      <button id="save">PNGを保存</button>
      <span id="transferStatus" class="status grow"></span>
    </div>
  </section>

  <section>
    <div class="row">
      <button id="copyDebug">ログをコピー</button>
      <button class="danger" id="clearDebug">クリア</button>
      <span id="version" class="status"></span>
    </div>
    <pre id="debugLog"></pre>
  </section>
</main>

<script>
'use strict';
const APP_HTML_VERSION = '2026.08.10.5';
window.NFC_CALENDAR_VERSION = APP_HTML_VERSION;

const $ = id => document.getElementById(id);
const canvas = $('calendar');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const loupe = $('loupe');
const loupeCanvas = $('loupeCanvas');
const loupeCtx = loupeCanvas.getContext('2d');
const WEEKDAYS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const DETAIL_WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
const SETTINGS_KEY = 'nfc-calendar-154-settings-v1';
const FRAME_OVERRIDES_KEY = 'nfc-calendar-154-frame-overrides-v1';
const HOLIDAY_OVERRIDES_KEY = 'nfc-calendar-154-holiday-overrides-v1';
const OLD_APP_DEFAULT_FONT = "'BIZ UDGothic', sans-serif";
const OLD_APP_DEFAULT_DETAIL_FONT = "'M PLUS 1p', sans-serif";
const COLS = 7;
const ROWS = 5;
const HEADER_H = 15;
const GRID_Y = 15;
const CALENDAR_BOTTOM = 140;
const MONTH_DIVIDER_X = 24;
const MONTH_CENTER_X = MONTH_DIVIDER_X / 2;
const GRID_X = 26;
const GRID_W = 173;
const CELL_W = GRID_W / COLS;
const CELL_H = (CALENDAR_BOTTOM - GRID_Y) / ROWS;

let calendarItems = [];
let taskItems = [];
let itemsByDate = new Map();
let automaticMarkedDates = new Set();
let frameOverrides = {};
let holidayOverrides = {};
let hitCells = [];
let editMode = 'event';
let selectedDetailKey = '';
let loupeTimer = 0;

const pad2 = value => String(value).padStart(2, '0');
const dateKey = date => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
function parseDate(key) {
  const [year, month, day] = key.split('-').map(Number);
  const date = new Date(year, month - 1, day);
  date.setHours(0, 0, 0, 0);
  return date;
}
function baseDate() { return parseDate($('baseDate').value); }
function displayedStart() {
  const date = baseDate();
  date.setDate(date.getDate() - date.getDay() - 14);
  return date;
}
function sixMonthHorizonEnd() {
  const date = baseDate();
  const originalDay = date.getDate();
  date.setDate(1);
  date.setMonth(date.getMonth() + 6);
  const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
  date.setDate(Math.min(originalDay, lastDay));
  date.setDate(date.getDate() + 1);
  return date;
}

function nthWeekday(year, month, weekday, nth) {
  const date = new Date(year, month, 1);
  return 1 + (weekday - date.getDay() + 7) % 7 + (nth - 1) * 7;
}
function springEquinox(year) {
  if (year <= 1979) return Math.floor(20.8357 + 0.242194 * (year - 1980) - Math.floor((year - 1983) / 4));
  return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}
function autumnEquinox(year) {
  if (year <= 1979) return Math.floor(23.2588 + 0.242194 * (year - 1980) - Math.floor((year - 1983) / 4));
  return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}
const holidayCache = new Map();
function holidays(year) {
  if (holidayCache.has(year)) return holidayCache.get(year);
  const set = new Set();
  const add = (month, day) => set.add(`${year}-${pad2(month + 1)}-${pad2(day)}`);
  add(0, 1); add(0, nthWeekday(year, 0, 1, 2)); add(1, 11);
  if (year >= 2020) add(1, 23);
  add(2, springEquinox(year)); add(3, 29); add(4, 3); add(4, 4); add(4, 5);
  add(6, year === 2020 ? 23 : year === 2021 ? 22 : nthWeekday(year, 6, 1, 3));
  add(7, year === 2020 ? 10 : year === 2021 ? 8 : 11);
  add(8, nthWeekday(year, 8, 1, 3)); add(8, autumnEquinox(year));
  add(9, year === 2020 ? 24 : year === 2021 ? 23 : nthWeekday(year, 9, 1, 2));
  add(10, 3); add(10, 23);
  if (year === 2019) { add(4, 1); add(9, 22); }
  for (const key of [...set].sort()) {
    const date = parseDate(key);
    if (date.getDay() !== 0) continue;
    do { date.setDate(date.getDate() + 1); } while (set.has(dateKey(date)));
    if (date.getFullYear() === year) set.add(dateKey(date));
  }
  for (let month = 0; month < 12; month++) {
    for (let day = 2; day <= 30; day++) {
      const date = new Date(year, month, day);
      if (date.getMonth() !== month || set.has(dateKey(date))) continue;
      const before = new Date(date); before.setDate(day - 1);
      const after = new Date(date); after.setDate(day + 1);
      if (set.has(dateKey(before)) && set.has(dateKey(after))) set.add(dateKey(date));
    }
  }
  holidayCache.set(year, set);
  return set;
}
const isAutomaticHoliday = date => date.getDay() === 0 || holidays(date.getFullYear()).has(dateKey(date));
function isHoliday(date) {
  const key = dateKey(date);
  return Object.prototype.hasOwnProperty.call(holidayOverrides, key)
    ? !!holidayOverrides[key] : isAutomaticHoliday(date);
}
function shouldMark(date) {
  const key = dateKey(date);
  return Object.prototype.hasOwnProperty.call(frameOverrides, key)
    ? !!frameOverrides[key] : automaticMarkedDates.has(key);
}

function rebuildItemIndex() {
  itemsByDate = new Map();
  automaticMarkedDates = new Set();
  for (const item of [...calendarItems, ...taskItems]) {
    if (!item || !item.date) continue;
    if (!itemsByDate.has(item.date)) itemsByDate.set(item.date, []);
    itemsByDate.get(item.date).push(item);
    automaticMarkedDates.add(item.date);
  }
  for (const values of itemsByDate.values()) {
    values.sort((a, b) => (a.type === b.type ? String(a.time || '').localeCompare(String(b.time || '')) : a.type === 'event' ? -1 : 1));
  }
}

function selectNearestDetailDate() {
  const baseKey = $('baseDate').value;
  const endKey = dateKey(sixMonthHorizonEnd());
  const candidates = new Set([...itemsByDate.keys(), ...Object.keys(frameOverrides)]);
  const available = [...candidates]
    .filter(key => key >= baseKey && key < endKey && shouldMark(parseDate(key)))
    .sort();
  selectedDetailKey = available[0] || baseKey;
}

function monthForRow(start, row) {
  const sunday = new Date(start);
  sunday.setDate(start.getDate() + row * 7);
  for (let offset = 0; offset < 7; offset++) {
    const date = new Date(sunday);
    date.setDate(sunday.getDate() + offset);
    if (date.getDate() === 1) return date.getMonth() + 1;
  }
  return sunday.getMonth() + 1;
}

function drawCalendar() {
  const family = $('fontFamily').value;
  const size = Math.max(13, Math.min(20, Number($('fontSize').value) || 17));
  const weight = $('bold').checked ? '700' : '400';
  const weekdaySize = Math.max(8, Math.min(15, size - 5));
  const monthSize = Math.max(10, Math.min(20,
    Number($('monthFontSize').value) || 15));
  const start = displayedStart();
  const baseKey = $('baseDate').value;
  hitCells = [];
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, 200, 200);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `${weight} ${weekdaySize}px ${family}`;
  for (let column = 0; column < COLS; column++) {
    ctx.fillStyle = column === 0 ? '#f00' : '#000';
    ctx.fillText(WEEKDAYS[column], GRID_X + column * CELL_W + CELL_W / 2, 9);
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(MONTH_DIVIDER_X + 1, HEADER_H - 1,
    200 - MONTH_DIVIDER_X - 1, 1);
  ctx.fillRect(MONTH_DIVIDER_X, 0, 1, CALENDAR_BOTTOM);

  for (let index = 0; index < ROWS * COLS; index++) {
    const row = Math.floor(index / COLS);
    const column = index % COLS;
    const date = new Date(start);
    date.setDate(start.getDate() + index);
    const key = dateKey(date);
    const x = GRID_X + column * CELL_W;
    const y = GRID_Y + row * CELL_H;
    const red = isHoliday(date);
    const selected = key === baseKey;
    hitCells.push({ key, x, y, w: CELL_W, h: CELL_H });
    if (selected) {
      ctx.fillStyle = red ? '#f00' : '#000';
      ctx.fillRect(Math.ceil(x) + 1, y + 2, Math.floor(CELL_W) - 2, CELL_H - 4);
    }
    if (shouldMark(date)) {
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(Math.ceil(x) + 0.75, y + 1.75, Math.floor(CELL_W) - 1.5, CELL_H - 3.5);
    }
    ctx.font = `${weight} ${size}px ${family}`;
    ctx.fillStyle = selected ? '#fff' : (red ? '#f00' : '#000');
    ctx.fillText(String(date.getDate()), x + CELL_W / 2, y + CELL_H / 2 + 1);
  }

  let previousMonth = -1;
  for (let row = 0; row < ROWS; row++) {
    const month = monthForRow(start, row);
    if (month === previousMonth) continue;
    previousMonth = month;
    ctx.font = `700 ${monthSize}px ${family}`;
    ctx.fillStyle = '#000';
    ctx.fillText(String(month), MONTH_CENTER_X,
      GRID_Y + row * CELL_H + CELL_H / 2 + 1);
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(0, CALENDAR_BOTTOM, 200, 1);
  drawDetails();
  ctx.restore();
  if ($('quantize').checked) quantizeThreeColor();
}

function fitText(text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let value = text;
  while (value.length > 1 && ctx.measureText(`${value}…`).width > maxWidth) value = value.slice(0, -1);
  return `${value}…`;
}
function drawDetails() {
  const family = $('detailFontFamily').value || OLD_APP_DEFAULT_DETAIL_FONT;
  const detailSize = Math.max(7, Math.min(14,
    Number($('detailFontSize').value) || 9));
  const detailWeight = $('detailBold').checked ? '700' : '400';
  const headerSize = Math.min(14, detailSize + 1);
  const key = selectedDetailKey || $('baseDate').value;
  const date = parseDate(key);
  const values = [...(itemsByDate.get(key) || [])];
  if (Object.prototype.hasOwnProperty.call(frameOverrides, key) && frameOverrides[key]
      && !automaticMarkedDates.has(key)) {
    values.push({ type: 'manual', title: '手動設定の予定' });
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#000';
  ctx.font = `${detailWeight} ${headerSize}px ${family}`;
  const header = `${date.getMonth() + 1}/${date.getDate()}(${DETAIL_WEEKDAYS[date.getDay()]})`;
  ctx.fillText(header, 2, 143);
  ctx.font = `${detailWeight} ${detailSize}px ${family}`;
  const firstLineY = 143 + headerSize + 2;
  if (values.length === 0) {
    ctx.fillText('予定・タスクなし', 2, firstLineY);
    return;
  }
  const lineHeight = detailSize + 2;
  const maxLines = Math.max(1, Math.floor((200 - firstLineY) / lineHeight));
  const visible = values.slice(0, maxLines);
  let y = firstLineY;
  visible.forEach((item, index) => {
    const prefix = item.type === 'task' ? '□ ' : '・';
    const time = item.time ? `${item.time} ` : '';
    const remaining = values.length - visible.length;
    const suffix = index === visible.length - 1 && remaining > 0
      ? `　ほか${remaining}件` : '';
    ctx.fillText(fitText(`${prefix}${time}${item.title || '名称なし'}${suffix}`, 196), 2, y);
    y += lineHeight;
  });
}

function quantizeThreeColor() {
  const image = ctx.getImageData(0, 0, 200, 200);
  const data = image.data;
  for (let index = 0; index < data.length; index += 4) {
    const red = data[index], green = data[index + 1], blue = data[index + 2];
    if (red > 130 && red > green * 1.35 && red > blue * 1.35) {
      data[index] = 255; data[index + 1] = 0; data[index + 2] = 0;
    } else {
      const value = red * 0.299 + green * 0.587 + blue * 0.114 < 170 ? 0 : 255;
      data[index] = value; data[index + 1] = value; data[index + 2] = value;
    }
    data[index + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
}

function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({
    fontSize: $('fontSize').value,
    monthFontSize: $('monthFontSize').value,
    fontFamily: $('fontFamily').value,
    detailFontSize: $('detailFontSize').value,
    detailFontFamily: $('detailFontFamily').value,
    detailBold: $('detailBold').checked,
    bold: $('bold').checked,
    quantize: $('quantize').checked
  }));
}
function restoreSettings() {
  try {
    const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    if (settings.fontSize) $('fontSize').value = settings.fontSize;
    if (settings.monthFontSize) $('monthFontSize').value = settings.monthFontSize;
    if (settings.fontFamily) {
      const migratedFont = ['sans-serif', 'serif', 'monospace'].includes(settings.fontFamily)
        ? OLD_APP_DEFAULT_FONT : settings.fontFamily;
      const supported = [...$('fontFamily').options].some(option => option.value === migratedFont);
      $('fontFamily').value = supported ? migratedFont : OLD_APP_DEFAULT_FONT;
    }
    if (settings.detailFontSize) $('detailFontSize').value = settings.detailFontSize;
    if (settings.detailFontFamily) {
      const supported = [...$('detailFontFamily').options]
        .some(option => option.value === settings.detailFontFamily);
      $('detailFontFamily').value = supported
        ? settings.detailFontFamily : OLD_APP_DEFAULT_DETAIL_FONT;
    }
    if (typeof settings.detailBold === 'boolean') {
      $('detailBold').checked = settings.detailBold;
    }
    if (typeof settings.bold === 'boolean') $('bold').checked = settings.bold;
    if (typeof settings.quantize === 'boolean') $('quantize').checked = settings.quantize;
    frameOverrides = JSON.parse(localStorage.getItem(FRAME_OVERRIDES_KEY) || '{}');
    holidayOverrides = JSON.parse(localStorage.getItem(HOLIDAY_OVERRIDES_KEY) || '{}');
  } catch (_) {
    frameOverrides = {};
    holidayOverrides = {};
  }
}
function saveOverrides() {
  localStorage.setItem(FRAME_OVERRIDES_KEY, JSON.stringify(frameOverrides));
  localStorage.setItem(HOLIDAY_OVERRIDES_KEY, JSON.stringify(holidayOverrides));
}

function requestCalendarData() {
  const start = displayedStart();
  const end = sixMonthHorizonEnd();
  if (window.AndroidInterface && window.AndroidInterface.requestCalendarData) {
    $('calendarState').textContent = '6か月先までのカレンダー予定を確認しています';
    window.AndroidInterface.requestCalendarData(start.getTime(), end.getTime());
  } else {
    $('calendarState').textContent = 'ブラウザ表示では予定・タスク連携を使用できません';
  }
}
window.receiveCalendarItems = payload => {
  try {
    calendarItems = typeof payload === 'string' ? JSON.parse(payload) : (payload || []);
    rebuildItemIndex();
    selectNearestDetailDate();
    $('calendarState').textContent = `カレンダー予定 ${calendarItems.length}件を反映`;
    drawCalendar();
  } catch (error) {
    $('calendarState').textContent = `予定の読み込みに失敗: ${error.message}`;
  }
};
window.receiveTaskItems = payload => {
  try {
    taskItems = typeof payload === 'string' ? JSON.parse(payload) : (payload || []);
    rebuildItemIndex();
    selectNearestDetailDate();
    $('tasksState').textContent = `未完了のGoogleタスク ${taskItems.length}件を反映`;
    drawCalendar();
  } catch (error) {
    $('tasksState').textContent = `タスクの読み込みに失敗: ${error.message}`;
  }
};
window.calendarPermissionDenied = () => $('calendarState').textContent = 'カレンダー権限が必要です';
window.tasksAuthorizationRequired = () => $('tasksState').textContent = '「Googleタスクを連携・更新」を押してください';
window.setTasksState = message => $('tasksState').textContent = message || '';

function setMode(mode) {
  editMode = mode;
  document.querySelectorAll('.mode').forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
  const help = {
    event: '日付を選ぶたびに、予定枠の有無を切り替えます。',
    holiday: '日付を選ぶたびに、休日の有無を切り替えます。'
  };
  $('modeHelp').textContent = help[mode];
}
function toggleEvent(key) {
  const automatic = automaticMarkedDates.has(key);
  const current = Object.prototype.hasOwnProperty.call(frameOverrides, key) ? !!frameOverrides[key] : automatic;
  frameOverrides[key] = !current;
  if (frameOverrides[key] === automatic) delete frameOverrides[key];
  saveOverrides();
}
function toggleHoliday(key) {
  const date = parseDate(key);
  const automatic = isAutomaticHoliday(date);
  holidayOverrides[key] = !isHoliday(date);
  if (holidayOverrides[key] === automatic) delete holidayOverrides[key];
  saveOverrides();
}

function showLoupe(clientX, clientY, pixelX, pixelY) {
  const shell = $('previewShell').getBoundingClientRect();
  const sourceSize = 30;
  const sourceX = Math.max(0, Math.min(200 - sourceSize, Math.round(pixelX - sourceSize / 2)));
  const sourceY = Math.max(0, Math.min(200 - sourceSize, Math.round(pixelY - sourceSize / 2)));
  loupeCtx.imageSmoothingEnabled = false;
  loupeCtx.clearRect(0, 0, 104, 104);
  loupeCtx.drawImage(canvas, sourceX, sourceY, sourceSize, sourceSize, 0, 0, 104, 104);
  loupe.style.left = `${Math.max(4, Math.min(shell.width - 116, clientX - shell.left - 56))}px`;
  loupe.style.top = `${Math.max(4, Math.min(shell.height - 116, clientY - shell.top - 126))}px`;
  loupe.classList.remove('hidden');
  clearTimeout(loupeTimer);
  loupeTimer = setTimeout(() => loupe.classList.add('hidden'), 900);
}

canvas.addEventListener('pointerdown', event => {
  const rect = canvas.getBoundingClientRect();
  const pixelX = (event.clientX - rect.left) * 200 / rect.width;
  const pixelY = (event.clientY - rect.top) * 200 / rect.height;
  const cell = hitCells.find(value => pixelX >= value.x && pixelX < value.x + value.w
    && pixelY >= value.y && pixelY < value.y + value.h);
  if (cell) {
    if (editMode === 'event') toggleEvent(cell.key);
    if (editMode === 'holiday') toggleHoliday(cell.key);
    selectNearestDetailDate();
    drawCalendar();
  }
  showLoupe(event.clientX, event.clientY, pixelX, pixelY);
});

document.querySelectorAll('.mode').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
function changeWeek(delta) {
  const date = baseDate();
  date.setDate(date.getDate() + delta * 7);
  $('baseDate').value = dateKey(date);
  selectedDetailKey = $('baseDate').value;
  calendarItems = [];
  taskItems = [];
  rebuildItemIndex();
  selectNearestDetailDate();
  drawCalendar();
  requestCalendarData();
}
$('prevWeek').addEventListener('click', () => changeWeek(-1));
$('nextWeek').addEventListener('click', () => changeWeek(1));
$('today').addEventListener('click', () => {
  $('baseDate').value = dateKey(new Date());
  selectedDetailKey = $('baseDate').value;
  calendarItems = [];
  taskItems = [];
  rebuildItemIndex();
  selectNearestDetailDate();
  drawCalendar();
  requestCalendarData();
});
$('baseDate').addEventListener('change', () => {
  selectedDetailKey = $('baseDate').value;
  calendarItems = [];
  taskItems = [];
  rebuildItemIndex();
  selectNearestDetailDate();
  drawCalendar();
  requestCalendarData();
});
$('connectTasks').addEventListener('click', () => {
  const start = displayedStart();
  const end = sixMonthHorizonEnd();
  if (window.AndroidInterface && window.AndroidInterface.requestGoogleTasksAccess) {
    window.AndroidInterface.requestGoogleTasksAccess(start.getTime(), end.getTime());
  } else {
    $('tasksState').textContent = 'ブラウザ表示ではGoogleタスク連携を使用できません';
  }
});
document.querySelectorAll('.stepper button').forEach(button => button.addEventListener('click', () => {
  const input = $(button.dataset.target);
  input.value = Math.max(Number(input.min), Math.min(Number(input.max), Number(input.value) + Number(button.dataset.step)));
  saveSettings();
  drawCalendar();
}));
['fontSize', 'monthFontSize', 'detailFontSize'].forEach(id => $(id).addEventListener('input', () => { saveSettings(); drawCalendar(); }));
['fontFamily', 'detailFontFamily', 'bold', 'detailBold', 'quantize'].forEach(id => $(id).addEventListener('change', () => { saveSettings(); drawCalendar(); }));

const imageDataUrl = () => canvas.toDataURL('image/png');
$('send').addEventListener('click', () => {
  if (window.AndroidInterface && window.AndroidInterface.onSendRequested) window.AndroidInterface.onSendRequested(imageDataUrl());
});
$('save').addEventListener('click', () => {
  const dataUrl = imageDataUrl();
  if (window.AndroidInterface && window.AndroidInterface.onSavePngRequested) {
    window.AndroidInterface.onSavePngRequested(dataUrl);
  } else {
    const anchor = document.createElement('a');
    anchor.download = 'epaper_calendar_200x200.png';
    anchor.href = dataUrl;
    anchor.click();
  }
});
window.setTransferStatus = message => $('transferStatus').textContent = message || '';
window.clearDebugLog = () => $('debugLog').textContent = '';
window.appendDebugLog = message => {
  const line = `[${new Date().toLocaleTimeString()}] ${message}`;
  $('debugLog').textContent += ($('debugLog').textContent ? '\n' : '') + line;
  $('debugLog').scrollTop = $('debugLog').scrollHeight;
};
$('clearDebug').addEventListener('click', window.clearDebugLog);
$('copyDebug').addEventListener('click', () => {
  const text = $('debugLog').textContent || '';
  if (window.AndroidInterface && window.AndroidInterface.copyDebugLog) window.AndroidInterface.copyDebugLog(text);
  else if (navigator.clipboard) navigator.clipboard.writeText(text);
});

$('baseDate').value = dateKey(new Date());
selectedDetailKey = $('baseDate').value;
$('version').textContent = `HTML v${APP_HTML_VERSION}`;
restoreSettings();
rebuildItemIndex();
if (new URLSearchParams(location.search).has('demo')) {
  const demoKey = $('baseDate').value;
  calendarItems = [
    { date: demoKey, type: 'event', time: '09:30', title: '定例ミーティング' },
    { date: demoKey, type: 'event', time: '14:00', title: '歯科検診' }
  ];
  taskItems = [
    { date: demoKey, type: 'task', title: '資料を提出する' },
    { date: demoKey, type: 'task', title: '買い物リストを確認' }
  ];
  rebuildItemIndex();
  selectNearestDetailDate();
}
drawCalendar();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(drawCalendar);
}
setTimeout(requestCalendarData, 250);
</script>
</body>
